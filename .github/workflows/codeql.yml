name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: csharp

      - name: Setup .NET SDK (repo pin)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore VectorNNTPD.slnx -p:Platform=x64

      # --no-incremental ensures CoreCompile/csc runs under the CodeQL tracer for every
      # project. An up-to-date incremental skip can leave only .csproj entries in the DB.
      - name: Build solution
        run: dotnet build VectorNNTPD.slnx --configuration Release -p:Platform=x64 --no-restore --no-incremental

      # upload: never — traced C# SARIF includes **/obj/** source-generator noise that
      # paths-ignore cannot drop. Filter first, then upload-sarif.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-sarif

      - name: Filter generated bin/obj findings from SARIF
        shell: pwsh
        run: |
          $inputs = Get-ChildItem -Path codeql-sarif -Filter *.sarif -File -ErrorAction Stop
          if ($inputs.Count -lt 1) {
            throw "No SARIF files found under codeql-sarif/"
          }
          New-Item -ItemType Directory -Force -Path codeql-sarif-filtered | Out-Null
          foreach ($sarif in $inputs) {
            $out = Join-Path codeql-sarif-filtered $sarif.Name
            & ./tools/Filter-CodeQlSarif.ps1 -InputPath $sarif.FullName -OutputPath $out
          }

      - name: Upload filtered CodeQL SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codeql-sarif-filtered
          category: csharp
