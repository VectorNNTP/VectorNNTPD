name: Build and Validate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build-test:
    name: Linux Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK (repo pin)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify solution project set
        shell: bash
        run: |
          set -euo pipefail

          disk_list="$(mktemp)"
          sln_list="$(mktemp)"
          find src tests -name '*.csproj' | sed 's|\\|/|g' | sed 's|^\./||' | sort -u > "$disk_list"
          dotnet sln VectorNNTPD.slnx list | tr -d '\r' | sed 's|\\|/|g' | sed 's|^\./||' | grep '\.csproj$' | sort -u > "$sln_list"

          if ! cmp -s "$disk_list" "$sln_list"; then
            echo "Solution membership does not match every project under src/ and tests/."
            echo "On disk but not in VectorNNTPD.slnx:"
            comm -23 "$disk_list" "$sln_list"
            echo "In VectorNNTPD.slnx but missing on disk:"
            comm -13 "$disk_list" "$sln_list"
            exit 1
          fi

          test_count=0
          prod_count=0
          while IFS= read -r proj; do
            if grep -q '<IsTestProject>true</IsTestProject>' "$proj"; then
              test_count=$((test_count + 1))
              case "$proj" in
                tests/*) ;;
                *)
                  echo "Test project must live under tests/: $proj"
                  exit 1
                  ;;
              esac
              grep -q 'Microsoft.NET.Test.Sdk' "$proj" || {
                echo "Test project is missing Microsoft.NET.Test.Sdk: $proj"
                exit 1
              }
            else
              prod_count=$((prod_count + 1))
              case "$proj" in
                src/*) ;;
                *)
                  echo "Production project must live under src/: $proj"
                  exit 1
                  ;;
              esac
            fi
          done < "$disk_list"

          if [ "$test_count" -lt 1 ]; then
            echo "No test project found under tests/."
            exit 1
          fi
          if [ "$prod_count" -lt 1 ]; then
            echo "No production project found under src/."
            exit 1
          fi

          echo "Solution projects:"
          cat "$sln_list"
          echo "Test projects: $test_count"
          echo "Production projects: $prod_count"

      - name: Restore solution
        run: dotnet restore VectorNNTPD.slnx -p:Platform=x64

      - name: Build solution
        # Platform x64 writes bin/x64/Release. The test step uses the same
        # property with --no-build so VSTest reads that output.
        # Native AOT publishing is a later runtime-identifier step.
        run: dotnet build VectorNNTPD.slnx --configuration Release -p:Platform=x64 --no-restore

      - name: Test solution
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          # Only the BackFiller test project references coverlet.collector. Passing
          # --collect to a project without that package makes VSTest fail before
          # the tests run. Coverage is collected for projects that already
          # reference the collector. Adding it to the other test projects is a
          # separate change.
          failed=0
          while IFS= read -r proj; do
            if ! grep -q '<IsTestProject>true</IsTestProject>' "$proj"; then
              continue
            fi
            name="$(basename "$proj" .csproj)"
            echo "Testing $name"
            if grep -q 'coverlet.collector' "$proj"; then
              if ! dotnet test "$proj" \
                --configuration Release \
                -p:Platform=x64 \
                --no-build \
                --no-restore \
                --collect:"XPlat Code Coverage" \
                --results-directory ./TestResults \
                --logger "trx;LogFileName=${name}.trx"; then
                echo "Tests failed: $name"
                failed=1
              fi
            else
              if ! dotnet test "$proj" \
                --configuration Release \
                -p:Platform=x64 \
                --no-build \
                --no-restore \
                --results-directory ./TestResults \
                --logger "trx;LogFileName=${name}.trx"; then
                echo "Tests failed: $name"
                failed=1
              fi
            fi
          done < <(find src tests -name '*.csproj' | sort)
          exit "$failed"

      - name: Verify every test project reported results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test_count=0
          coverlet_count=0
          while IFS= read -r proj; do
            if grep -q '<IsTestProject>true</IsTestProject>' "$proj"; then
              test_count=$((test_count + 1))
              if grep -q 'coverlet.collector' "$proj"; then
                coverlet_count=$((coverlet_count + 1))
              fi
            fi
          done < <(find src tests -name '*.csproj' | sort)
          trx_count=0
          cov_count=0
          if [ -d TestResults ]; then
            trx_count="$(find TestResults -name '*.trx' | wc -l | tr -d '[:space:]')"
            cov_count="$(find TestResults -name 'coverage.cobertura.xml' | wc -l | tr -d '[:space:]')"
          fi
          echo "test projects=$test_count coverlet projects=$coverlet_count trx=$trx_count coverage=$cov_count"
          if [ "$trx_count" -lt "$test_count" ]; then
            echo "Expected at least one TRX file per test project."
            find TestResults -name '*.trx' -print || true
            exit 1
          fi
          if [ "$coverlet_count" -eq 0 ]; then
            echo "No test project references coverlet.collector, so coverage cannot be collected."
            exit 1
          fi
          if [ "$cov_count" -lt "$coverlet_count" ]; then
            echo "Expected at least one Cobertura file per test project that references coverlet.collector."
            find TestResults -name 'coverage.cobertura.xml' -print || true
            exit 1
          fi

      - name: Generate coverage report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:TestResults/CoverageReport" \
            "-reporttypes:Html;Cobertura;TextSummary"

      - name: Add coverage summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f TestResults/CoverageReport/Summary.txt ]]; then
            echo "Coverage summary was not produced."
            exit 1
          fi
          cat TestResults/CoverageReport/Summary.txt
          {
            echo "## Code Coverage"
            echo
            echo '```text'
            cat TestResults/CoverageReport/Summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: TestResults/CoverageReport/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-test-results
          path: TestResults/**/*.trx
          if-no-files-found: error
          retention-days: 14

      - name: Publish production services linux-x64
        # Same Native AOT invocation as tools/Publish-Release.ps1, plus the
        # x64 platform contract. Publish restores the ILCompiler pack and the
        # StuDev.AotAnywhere Zig toolchain for this runtime identifier.
        # Each host publishes into its own package directory (independent deploy).
        run: |
          set -euo pipefail
          root=./.artifacts/linux-x64
          mkdir -p "$root"
          publish_one() {
            local package="$1"
            local proj="$2"
            local out="$root/$package"
            mkdir -p "$out"
            dotnet publish "$proj" \
              --configuration Release \
              -p:Platform=x64 \
              --runtime linux-x64 \
              --self-contained true \
              -p:PublishAot=true \
              -p:SelfContained=true \
              --output "$out"
          }
          publish_one backfiller src/VectorNNTPD.BackFillerService/VectorNNTPD.BackFillerService.csproj
          publish_one storage src/VectorNNTPD.StorageService/VectorNNTPD.StorageService.csproj
          publish_one reader src/VectorNNTPD.ReaderService/VectorNNTPD.ReaderService.csproj
          publish_one transit src/VectorNNTPD.TransitService/VectorNNTPD.TransitService.csproj

      - name: Add Linux deployment files
        shell: bash
        run: |
          set -euo pipefail
          root=./.artifacts/linux-x64
          test -f deploy/systemd/vectornntp-backfiller.service
          test -f deploy/systemd/backfiller.env.example
          test -f deploy/systemd/vectornntp-storageservice.service
          test -f deploy/systemd/storageservice.env.example
          test -f deploy/systemd/vectornntp-reader.service
          test -f deploy/systemd/reader.env.example
          test -f deploy/systemd/vectornntp-transit.service
          test -f deploy/systemd/transit.env.example
          test -f README.md
          cp deploy/systemd/vectornntp-backfiller.service "$root/backfiller/vectornntp-backfiller.service"
          cp deploy/systemd/backfiller.env.example "$root/backfiller/backfiller.env.example"
          cp README.md "$root/backfiller/README.md"
          cp deploy/systemd/vectornntp-storageservice.service "$root/storage/vectornntp-storageservice.service"
          cp deploy/systemd/storageservice.env.example "$root/storage/storageservice.env.example"
          cp README.md "$root/storage/README.md"
          cp deploy/systemd/vectornntp-reader.service "$root/reader/vectornntp-reader.service"
          cp deploy/systemd/reader.env.example "$root/reader/reader.env.example"
          cp README.md "$root/reader/README.md"
          cp deploy/systemd/vectornntp-transit.service "$root/transit/vectornntp-transit.service"
          cp deploy/systemd/transit.env.example "$root/transit/transit.env.example"
          cp README.md "$root/transit/README.md"

      - name: Validate linux-x64 Native AOT packages
        shell: bash
        run: |
          set -euo pipefail
          root=./.artifacts/linux-x64
          validate_pkg() {
            local package="$1"
            local exe_name="$2"
            local config_name="$3"
            local unit_name="$4"
            local env_name="$5"
            local dir="$root/$package"
            local exe="$dir/$exe_name"
            test -d "$dir"
            test -f "$exe"
            test -x "$exe"
            test -f "$dir/$config_name"
            test -f "$dir/VectorNNTPD.RabbitMQ.json"
            test -f "$dir/$unit_name"
            test -f "$dir/$env_name"
            test -f "$dir/README.md"
            file "$exe"
            readelf -h "$exe"
            objdump -f "$exe"
            file -b "$exe" | grep -q "ELF 64-bit LSB"
            file -b "$exe" | grep -q "x86-64"
            readelf -h "$exe" | grep -q "Class:[[:space:]]*ELF64"
            readelf -h "$exe" | grep -q "Data:[[:space:]]*2's complement, little endian"
            readelf -h "$exe" | grep -q "Machine:[[:space:]]*Advanced Micro Devices X86-64"
            readelf -h "$exe" | grep -E -q "Type:[[:space:]]*(EXEC|DYN)"
            objdump -f "$exe" | grep -q "elf64-x86-64"
            if ldd "$exe" | grep -E -q 'coreclr|hostfxr'; then
              echo "Executable depends on the shared CLR: $exe"
              ldd "$exe"
              exit 1
            fi
            for forbidden in \
              "$exe_name.dll" \
              libcoreclr.so libhostfxr.so coreclr.dll hostfxr.dll \
              appsettings.json RabbitMq.json VectorNNTP.RabbitMQ.json VectorNNTP.StorageServer.json \
              VectorNNTPD.NntpServer.dll VectorNNTPD.NntpServer.exe libVectorNNTPD.NntpServer.so
            do
              if [ -e "$dir/$forbidden" ]; then
                echo "Package $package contains forbidden file $forbidden."
                exit 1
              fi
            done
            if find "$dir" -maxdepth 1 -type f -iname '*NntpServer*' | grep -q .; then
              echo "Package $package contains an unexpected NntpServer artifact."
              find "$dir" -maxdepth 1 -type f -iname '*NntpServer*' -print
              exit 1
            fi
            # Role isolation: foreign host JSON/exe must not appear in this package.
            for foreign in \
              VectorNNTPD.BackFillerService \
              VectorNNTPD.StorageService \
              VectorNNTPD.ReaderService \
              VectorNNTPD.TransitService
            do
              if [ "$foreign" = "$exe_name" ]; then
                continue
              fi
              if [ -e "$dir/$foreign" ] || [ -e "$dir/$foreign.json" ]; then
                echo "Package $package unexpectedly contains foreign host artifact $foreign."
                exit 1
              fi
            done
          }
          validate_pkg backfiller VectorNNTPD.BackFillerService VectorNNTPD.BackFillerService.json vectornntp-backfiller.service backfiller.env.example
          validate_pkg storage VectorNNTPD.StorageService VectorNNTPD.StorageService.json vectornntp-storageservice.service storageservice.env.example
          validate_pkg reader VectorNNTPD.ReaderService VectorNNTPD.ReaderService.json vectornntp-reader.service reader.env.example
          validate_pkg transit VectorNNTPD.TransitService VectorNNTPD.TransitService.json vectornntp-transit.service transit.env.example
          # Platform root must contain only the four package directories.
          for unexpected in VectorNNTPD.BackFillerService VectorNNTPD.StorageService VectorNNTPD.ReaderService VectorNNTPD.TransitService \
            VectorNNTPD.BackFillerService.json VectorNNTPD.StorageService.json VectorNNTPD.ReaderService.json VectorNNTPD.TransitService.json \
            VectorNNTPD.RabbitMQ.json README.md; do
            if [ -e "$root/$unexpected" ]; then
              echo "Loose file at platform root is not allowed: $root/$unexpected"
              exit 1
            fi
          done

      - name: Smoke-test linux-x64 Native AOT startup (BackFiller)
        shell: bash
        run: |
          set -euo pipefail
          exe=./.artifacts/linux-x64/backfiller/VectorNNTPD.BackFillerService
          config="$PWD/tests/VectorNNTPD.BackFillerService.Tests/Fixtures/startup-smoke.json"
          test -f "$exe"
          test -f "$config"
          export VECTORNNTP_BACKFILLER_STARTUP_SMOKE=1
          export VECTORNNTP_BACKFILLER_STARTUP_SMOKE_CONFIG="$config"
          set +e
          timeout 30 "$exe" >./.artifacts/linux-x64-backfiller-smoke-stdout.txt 2>./.artifacts/linux-x64-backfiller-smoke-stderr.txt
          code=$?
          set -e
          echo "linux-x64 BackFiller startup smoke exit=$code"
          echo "----- stdout -----"
          cat ./.artifacts/linux-x64-backfiller-smoke-stdout.txt
          echo "----- stderr -----"
          cat ./.artifacts/linux-x64-backfiller-smoke-stderr.txt
          if [ "$code" -eq 124 ]; then
            echo "linux-x64 BackFiller startup smoke timed out."
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "linux-x64 BackFiller startup smoke failed."
            exit 1
          fi
          grep -q "BackFiller startup smoke: configuration serverId=1 fqdn=backfiller01.usenet.ninja" ./.artifacts/linux-x64-backfiller-smoke-stdout.txt

      - name: Smoke-test linux-x64 Native AOT startup (StorageService)
        shell: bash
        run: |
          set -euo pipefail
          exe=./.artifacts/linux-x64/storage/VectorNNTPD.StorageService
          config="$PWD/tests/VectorNNTPD.StorageService.Tests/Fixtures/startup-smoke.json"
          test -f "$exe"
          test -f "$config"
          export VECTORNNTP_STORAGESERVICE_STARTUP_SMOKE=1
          export VECTORNNTP_STORAGESERVICE_STARTUP_SMOKE_CONFIG="$config"
          set +e
          timeout 30 "$exe" >./.artifacts/linux-x64-storageservice-smoke-stdout.txt 2>./.artifacts/linux-x64-storageservice-smoke-stderr.txt
          code=$?
          set -e
          echo "linux-x64 StorageService startup smoke exit=$code"
          echo "----- stdout -----"
          cat ./.artifacts/linux-x64-storageservice-smoke-stdout.txt
          echo "----- stderr -----"
          cat ./.artifacts/linux-x64-storageservice-smoke-stderr.txt
          if [ "$code" -eq 124 ]; then
            echo "linux-x64 StorageService startup smoke timed out."
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "linux-x64 StorageService startup smoke failed."
            exit 1
          fi
          grep -q "StorageService startup smoke: configuration serverId=1 fqdn=cache01.usenet.ninja" ./.artifacts/linux-x64-storageservice-smoke-stdout.txt
          grep -q "Application logging initialized" ./.artifacts/linux-x64-storageservice-smoke-stdout.txt
          grep -q "VectorNNTPD.StorageService host starting" ./.artifacts/linux-x64-storageservice-smoke-stdout.txt

      - name: Smoke-test linux-x64 Native AOT startup (ReaderService)
        shell: bash
        run: |
          set -euo pipefail
          exe=./.artifacts/linux-x64/reader/VectorNNTPD.ReaderService
          config="$PWD/tests/VectorNNTPD.ReaderService.Tests/Fixtures/startup-smoke-reader.json"
          test -f "$exe"
          test -f "$config"
          export VECTORNNTP_READER_STARTUP_SMOKE=1
          export VECTORNNTP_READER_STARTUP_SMOKE_CONFIG="$config"
          set +e
          timeout 30 "$exe" >./.artifacts/linux-x64-reader-smoke-stdout.txt 2>./.artifacts/linux-x64-reader-smoke-stderr.txt
          code=$?
          set -e
          echo "linux-x64 ReaderService startup smoke exit=$code"
          echo "----- stdout -----"
          cat ./.artifacts/linux-x64-reader-smoke-stdout.txt
          echo "----- stderr -----"
          cat ./.artifacts/linux-x64-reader-smoke-stderr.txt
          if [ "$code" -eq 124 ]; then
            echo "linux-x64 ReaderService startup smoke timed out."
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "linux-x64 ReaderService startup smoke failed."
            exit 1
          fi
          grep -q "ReaderService startup smoke: configuration serverId=1 fqdn=reader01.usenet.ninja" ./.artifacts/linux-x64-reader-smoke-stdout.txt
          grep -q "VectorNNTPD.ReaderService host starting" ./.artifacts/linux-x64-reader-smoke-stdout.txt

      - name: Smoke-test linux-x64 Native AOT startup (TransitService)
        shell: bash
        run: |
          set -euo pipefail
          exe=./.artifacts/linux-x64/transit/VectorNNTPD.TransitService
          config="$PWD/tests/VectorNNTPD.TransitService.Tests/Fixtures/startup-smoke-transit.json"
          test -f "$exe"
          test -f "$config"
          export VECTORNNTP_TRANSIT_STARTUP_SMOKE=1
          export VECTORNNTP_TRANSIT_STARTUP_SMOKE_CONFIG="$config"
          set +e
          timeout 30 "$exe" >./.artifacts/linux-x64-transit-smoke-stdout.txt 2>./.artifacts/linux-x64-transit-smoke-stderr.txt
          code=$?
          set -e
          echo "linux-x64 TransitService startup smoke exit=$code"
          echo "----- stdout -----"
          cat ./.artifacts/linux-x64-transit-smoke-stdout.txt
          echo "----- stderr -----"
          cat ./.artifacts/linux-x64-transit-smoke-stderr.txt
          if [ "$code" -eq 124 ]; then
            echo "linux-x64 TransitService startup smoke timed out."
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "linux-x64 TransitService startup smoke failed."
            exit 1
          fi
          grep -q "TransitService startup smoke: configuration serverId=1 fqdn=transit01.usenet.ninja" ./.artifacts/linux-x64-transit-smoke-stdout.txt
          grep -q "VectorNNTPD.TransitService host starting" ./.artifacts/linux-x64-transit-smoke-stdout.txt

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v7
        with:
          name: vectornntpd-linux-x64-ci-build
          path: .artifacts/linux-x64/
          if-no-files-found: error
          retention-days: 7

  windows-build:
    name: Windows Build Validation
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK (repo pin)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore VectorNNTPD.slnx -p:Platform=x64

      - name: Build solution
        # Same x64 Release build as Linux. This job does not repeat tests.
        # VectorNNTPD.slnx is the canonical CI entrypoint for the production and test projects.
        run: dotnet build VectorNNTPD.slnx --configuration Release -p:Platform=x64 --no-restore

      - name: Publish production services win-x64
        # Native AOT. PublishAot is true only for this runtime identifier, and the
        # ILCompiler pack is restored only when that identifier is present.
        # The solution restore above does not pass a runtime identifier, so this
        # publish restores itself. --no-restore here would publish a self-contained
        # managed app and the RequireNativeAotCompiler target would fail.
        # Each host publishes into its own package directory (independent deploy).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = './.artifacts/win-x64'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $packages = @(
            @{ Package = 'backfiller'; Project = 'src/VectorNNTPD.BackFillerService/VectorNNTPD.BackFillerService.csproj' },
            @{ Package = 'storage'; Project = 'src/VectorNNTPD.StorageService/VectorNNTPD.StorageService.csproj' },
            @{ Package = 'reader'; Project = 'src/VectorNNTPD.ReaderService/VectorNNTPD.ReaderService.csproj' },
            @{ Package = 'transit'; Project = 'src/VectorNNTPD.TransitService/VectorNNTPD.TransitService.csproj' }
          )
          foreach ($item in $packages) {
            $out = Join-Path $root $item.Package
            New-Item -ItemType Directory -Path $out -Force | Out-Null
            dotnet publish $item.Project `
              --configuration Release `
              -p:Platform=x64 `
              --runtime win-x64 `
              --self-contained true `
              -p:PublishAot=true `
              -p:SelfContained=true `
              --output $out
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for $($item.Project)" }
          }

      - name: Validate win-x64 Native AOT packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = './.artifacts/win-x64'
          function Test-WinNativeAotExe([string] $exe) {
            if (-not (Test-Path -LiteralPath $exe)) { throw "Missing $exe" }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
            if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Expected a Windows PE executable: $exe" }
            $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
            if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) { throw "Missing PE signature: $exe" }
            $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) { throw "Expected x64 machine 0x8664 and found 0x$('{0:X4}' -f $machine): $exe" }
            $optional = $peOffset + 24
            $magic = [System.BitConverter]::ToUInt16($bytes, $optional)
            if ($magic -ne 0x20B) { throw "Expected PE32+ and found magic 0x$('{0:X4}' -f $magic): $exe" }
            $clrSize = [System.BitConverter]::ToUInt32($bytes, $optional + 112 + (14 * 8) + 4)
            if ($clrSize -ne 0) { throw "Executable still has a CLR runtime header, so it is not Native AOT: $exe" }
          }
          function Test-WinPackage([string] $package, [string] $exeBase, [string] $configName) {
            $dir = Join-Path $root $package
            if (-not (Test-Path -LiteralPath $dir)) { throw "Missing package directory $dir" }
            $exe = Join-Path $dir ($exeBase + '.exe')
            Test-WinNativeAotExe $exe
            foreach ($required in @($configName, 'VectorNNTPD.RabbitMQ.json')) {
              $path = Join-Path $dir $required
              if (-not (Test-Path -LiteralPath $path)) { throw "Missing $path" }
            }
            foreach ($forbidden in @(
              ($exeBase + '.dll'),
              'coreclr.dll', 'hostfxr.dll', 'libcoreclr.so', 'libhostfxr.so',
              'vectornntp-backfiller.service', 'backfiller.env.example',
              'vectornntp-storageservice.service', 'storageservice.env.example',
              'vectornntp-reader.service', 'reader.env.example',
              'vectornntp-transit.service', 'transit.env.example',
              'appsettings.json', 'RabbitMq.json', 'VectorNNTP.RabbitMQ.json', 'VectorNNTP.StorageServer.json',
              'VectorNNTPD.StorageService.Development.json', 'VectorNNTPD.BackFillerService.Development.json',
              'VectorNNTPD.ReaderService.Development.json', 'VectorNNTPD.TransitService.Development.json',
              'VectorNNTPD.NntpServer.dll', 'VectorNNTPD.NntpServer.exe'
            )) {
              $path = Join-Path $dir $forbidden
              if (Test-Path -LiteralPath $path) { throw "Package $package contains forbidden file $forbidden." }
            }
            $nntpHits = @(Get-ChildItem -LiteralPath $dir -File -Force | Where-Object { $_.Name -like '*NntpServer*' })
            if ($nntpHits.Count -gt 0) {
              throw "Package $package contains unexpected NntpServer artifacts: $($nntpHits.Name -join ', ')."
            }
            foreach ($foreign in @(
              'VectorNNTPD.BackFillerService',
              'VectorNNTPD.StorageService',
              'VectorNNTPD.ReaderService',
              'VectorNNTPD.TransitService'
            )) {
              if ($foreign -eq $exeBase) { continue }
              if ((Test-Path -LiteralPath (Join-Path $dir ($foreign + '.exe'))) -or (Test-Path -LiteralPath (Join-Path $dir ($foreign + '.json')))) {
                throw "Package $package unexpectedly contains foreign host artifact $foreign."
              }
            }
          }
          Test-WinPackage 'backfiller' 'VectorNNTPD.BackFillerService' 'VectorNNTPD.BackFillerService.json'
          Test-WinPackage 'storage' 'VectorNNTPD.StorageService' 'VectorNNTPD.StorageService.json'
          Test-WinPackage 'reader' 'VectorNNTPD.ReaderService' 'VectorNNTPD.ReaderService.json'
          Test-WinPackage 'transit' 'VectorNNTPD.TransitService' 'VectorNNTPD.TransitService.json'
          foreach ($loose in @(
            'VectorNNTPD.BackFillerService.exe', 'VectorNNTPD.StorageService.exe',
            'VectorNNTPD.ReaderService.exe', 'VectorNNTPD.TransitService.exe',
            'VectorNNTPD.BackFillerService.json', 'VectorNNTPD.StorageService.json',
            'VectorNNTPD.ReaderService.json', 'VectorNNTPD.TransitService.json',
            'VectorNNTPD.RabbitMQ.json'
          )) {
            $path = Join-Path $root $loose
            if (Test-Path -LiteralPath $path) { throw "Loose file at platform root is not allowed: $path" }
          }

      - name: Smoke-test win-x64 Native AOT startup (BackFiller)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Resolve-Path './.artifacts/win-x64/backfiller') 'VectorNNTPD.BackFillerService.exe'
          $config = (Resolve-Path './tests/VectorNNTPD.BackFillerService.Tests/Fixtures/startup-smoke.json').Path
          $stdoutPath = Join-Path (Resolve-Path './.artifacts') 'win-x64-backfiller-smoke-stdout.txt'
          $stderrPath = Join-Path (Resolve-Path './.artifacts') 'win-x64-backfiller-smoke-stderr.txt'
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo.FileName = $exe
          $process.StartInfo.WorkingDirectory = Split-Path -Parent $exe
          $process.StartInfo.UseShellExecute = $false
          $process.StartInfo.RedirectStandardOutput = $true
          $process.StartInfo.RedirectStandardError = $true
          $process.StartInfo.Environment['VECTORNNTP_BACKFILLER_STARTUP_SMOKE'] = '1'
          $process.StartInfo.Environment['VECTORNNTP_BACKFILLER_STARTUP_SMOKE_CONFIG'] = $config
          if (-not $process.Start()) { throw 'Failed to start the win-x64 BackFiller startup smoke process.' }
          $stdoutTask = $process.StandardOutput.ReadToEndAsync()
          $stderrTask = $process.StandardError.ReadToEndAsync()
          if (-not $process.WaitForExit(30000)) {
            try { $process.Kill($true) } catch { }
            throw 'win-x64 BackFiller startup smoke timed out.'
          }
          $process.WaitForExit()
          $stdout = $stdoutTask.GetAwaiter().GetResult()
          $stderr = $stderrTask.GetAwaiter().GetResult()
          Set-Content -LiteralPath $stdoutPath -Value $stdout
          Set-Content -LiteralPath $stderrPath -Value $stderr
          Write-Host "win-x64 BackFiller startup smoke exit=$($process.ExitCode)"
          Write-Host '----- stdout -----'
          Write-Host $stdout
          Write-Host '----- stderr -----'
          Write-Host $stderr
          if ($process.ExitCode -ne 0) { throw 'win-x64 BackFiller startup smoke failed.' }
          if ($stdout -notmatch 'BackFiller startup smoke: configuration serverId=1 fqdn=backfiller01\.usenet\.ninja') {
            throw 'win-x64 BackFiller startup smoke did not reach the configuration checkpoint.'
          }

